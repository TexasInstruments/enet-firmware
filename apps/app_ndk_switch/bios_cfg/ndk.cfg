/* ================ General configuration ================ */
function init(ndkCfgArg)
{
    var enableStaticIP         = 0;
    var enableTelnet           = 1;

    /* NDK modules */
    var Global                 = xdc.useModule('ti.ndk.config.Global');
    var Ip                     = xdc.useModule('ti.ndk.config.Ip');
    var Tcp                    = xdc.useModule('ti.ndk.config.Tcp');
    var Udp                    = xdc.useModule('ti.ndk.config.Udp');
    var Telnet                 = xdc.useModule('ti.ndk.config.Telnet');
        var Http                   = xdc.useModule('ti.ndk.config.Http');

    Global.stackInitHook       = "&stackInitHook";
    Global.stackDeleteHook     = '&stackDeleteHook';
    Global.ndkThreadStackSize  = 16384;
    Global.networkOpenHook     = '&netOpenHook';
    Global.networkCloseHook    = '&netCloseHook';
    Global.networkIPAddrHook   = '&IpAddrHookFxn';
    /* automatically call fdOpen/CloseSession for our sockets Task */
    Global.autoOpenCloseFD     = true;

    Global.stackLibType        = Global.MIN;
    Global.netSchedulerPri     = Global.NC_PRIORITY_HIGH;
    Global.debugAbortLevel     = Global.DBG_NONE;
    Global.debugPrintLevel     = Global.DBG_NONE;

    /* Assign memory sections and sizes */
    Global.pbmDataSection      = ".bss:NDK_PACKETMEM";
    Global.memDataSection      = ".bss:NDK_MMBUFFER";
    Global.lowTaskStackSize    = 8192;
    Global.normTaskStackSize   = 8192;
    Global.highTaskStackSize   = 8192;
    Global.ndkThreadStackSize  = 8192;
    /* TODO Set this value using NDK2CPSW_RX_PACKETS & NDK2CPSW_TX_PACKETS?? */
     Global.pktNumFrameBufs     = 512;
    Global.pktSizeFrameBuf     = 1664;

    Global.memRawPageSize      = 3072;
    Global.memRawPageCount     = 16;
    /* change the size of our receive buffers */
    Tcp.transmitBufSize        = 64*1024;
    Tcp.receiveBufSize         = 64*1024;
    Tcp.receiveBufLimit        = 64*1024;
    Udp.receiveBufSize         = 64*1024;

    /* increase buffer sizes when NDK runs on A53/A72 to get higher throughput */
    var NdkProcToUse = ndkCfgArg.core;
    xdc.print("# !!! Using NDK configuration for [" + NdkProcToUse + "]");
    if(NdkProcToUse=="mpu1_0")
    {
        Global.pktNumFrameBufs     = 192*8;
        Global.memRawPageCount     = 16*16;
        Tcp.transmitBufSize        = 256*1024;
        Tcp.receiveBufSize         = 256*1024;
        Tcp.receiveBufLimit        = 256*1024;
    }

    if (enableStaticIP)
    {
        /* Settings for static IP configuration */
        Ip.ResolveIP = false;
        Ip.CallByIP = false;
        Ip.autoIp = false;
        Ip.address = "192.168.1.203";
        Ip.mask = "255.255.255.0";
        Ip.gatewayIpAddr = "192.168.1.1";
    }
    else
    {
        Ip.dhcpClientMode = Ip.CIS_FLG_IFIDXVALID;
    }

    if(enableTelnet)
    {
        /* Add a Telnet server */
        var telnetParams = new Telnet.Params();
        telnetParams.callBackFxn = '&ConsoleOpen';
        var telnet = Telnet.create(telnetParams);

        /* Add some user accounts */
        var acct1 = new Global.Account();
        acct1.username = "username";
        acct1.password = "password";
        Global.addUserAccount(acct1);
    }

        /* Add an Http server */
        var http1Params = new Http.Params();
        http1Params.maxCon = 2;
        http1Params.ifIdx = 1;
        var http1 = Http.create(http1Params);
}

